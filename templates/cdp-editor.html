ation across Braze, Salesforce, HubSpot and advertising platforms, enabling coordinated engagement across owned and paid channels</li><li>Automated the CDP Data Dictionary to provide a reusable reference for customer data definitions and support consistent interpretation across teams</li><li>Built an Audience Explorer platform for Marketing Planning and Strategy teams, enabling audience exploration to inform campaign planning</li><li>Coordinated with data, engineering and compliance teams on data quality, governance and consent, supporting reliable customer data use across the marketing ecosystem</li><li>Enabled marketers through training, briefing templates and a Quarterly Showcase, supporting clearer campaign requirements and adoption of CDP capabilities</li></ul></div></foreignObject><rect class="cdp-icon-backplate" x="219.93" y="412" width="22" height="21" fill="white"/><svg class="cdp-achievements-icon" x="222.28" y="414" width="17.3" height="17.3" viewBox="162 153 188 206" overflow="hidden"><image x="0" y="0" width="512" height="512" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAYAAAD0eNT6AAAACXBIWXMAAH37AAB9+wGz7o3gAAAAGXRFWHRTb2Z0d2FyZQB3d3cuaW5rc2NhcGUub3Jnm+48GgAAEYpJREFUeJzt3X/srndZ2PH3aeuk9LSUUmjLDy3VgeAGKriB4Ag4UASUggQloTEsdsaNsSwmZVmcYEa2JVumE0U2/wAMDlgikfFDKMpkUydCZTIoP0RLV7GK0kJbaOmv/XF3C3btOed7nvv5fu7nuV+v5MrJadrrez2f5+lzXd/7x+cuAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA4F4dGV0ALMyzqoeMLoKt+JPqHaOLAGCZLq/uFHsZlwf8P6eMLgAAOHwGAABYIQMAAKyQAQAAVsgAAAArZAAAgBUyAADAChkAAGCFDAAAsEIGAABYIQMAAKyQAQAAVsgAAAArZAAAgBUyAADAChkAAGCFDAAAsEIGAABYIQMAAKyQAQAA cember 2020</td><th>To:</th><td data-editor-id="f038">April 2024</td><th>Duration:</th><td data-editor-id="f039">3 Years 4 Months</td></tr><tr><th colspan="2">Designation:</th><td colspan="5" data-editor-id="f040">SFMC / PARDOT TECHNICAL LEAD</td></tr><tr><th colspan="2">Responsibilities</th><td colspan="5"><ul data-editor-id="f041"><li>Led end-to-end SFMC and Pardot implementations, designing complex Journey Builder workflows and audience segmentation using SQL and Automation Studio.</li><li>Built and personalized email and SMS campaigns using Content Builder, AMPscript, and CloudPages (HTML, CSS, JavaScript).</li><li>Provided Technical Leadership and troubleshooting across marketing automation platforms to ensure campaign quality and platform stability.</li><li>Led and mentored a global marketing automation team, overseeing delivery, quality checks, and training of new resources.</li><li>Partnered with global stakeholders to support campaign strategy, prototyping, testing, and ongoing operational support.</li></ul></td></tr><tr><th colspan="2">Achievements</th><td colspan="5"><ul data-editor-id="f042"><li>I was honored to receive the "Out of The Box Thinker" Award from the client in recognition of my invaluable contribution to the establishment of a “Knowledge-sharing Hub”.</li><li>I was honored with the "Star Innovation Individual" award by Accenture for exceptional innovation and client empowerment.</li><li>I developed an “Automation Error Dashboard” integrating Power BI with SFMC, optimizing Salesforce Marketing Cloud's error resolution and ensuring uninterrupted business operations.</li><li>I developed an SFMC tool for effortlessly finding a Data Extensions within a Business Unit.</li></ul></td></tr></tbody></table><div class="compact-table"><div class="compact-row company-row"><div class="compact-cell" style="width:17.656722547884858%"><strong>Company Name:</strong></div><div class="compact-cell" style="width:82.34327745211515%" data-editor-id="f043"><strong> CAPGEMINI</strong></div></div><div class="compact-row"><div class="compact-cell" style="width:9.279020274054437%"><strong>From:</strong></div><div class="compact-cell" style="width:17.42821939289848%" data-editor-id="f044">January 2018</div><div class="compact-cell" style="width:5.225329500056002%"><strong> To:</strong></div><div class="compact-cell" style="width:18.481872829780084%" data-editor-id="f045">December 2020</div><div class="compact-cell" style="width:11.16006421984095%"><strong>Duration:</strong></div><div class="compact-cell" style="width:38.42549378337004%" data-editor-id="f046">3 Years</div></div><div class="compact-row"><div class="compact-cell" style="width:17.656722547884858%"><strong>Designation:</strong></div><div class="compact-cell" style="width:82.34327745211515%" data-editor-id="f047">CAMPAIGN MANAGER (GLOBAL)</div></div><div class="compact-row"><div class="compact-cell" style="width:17.656722547884858%"><strong>Responsibilities</strong></div><div class="compact-cell" style="width:82.34327745211515%" data-editor-id="f048">I developed, tested, and executed marketing automation campaigns aligned with client objectives. This included creating drip, nurture, batch, and trigger campaigns, setting up events, building programs, implementing lead scoring systems, and leveraging recipient data for personalized communications.</div></div><div class="compact-row"><div class="compact-cell" style="width:17.656722547884858%"><strong>Achievements</strong></div><div class="compact-cell" style="width:82.34327745211515%" data-editor-id="f049">▪ Awarded the Capgemini’s “<strong>XtraMile</strong>” for performance and contribution to Campaign ▪ Stream line Campaign Management processes by developing a portal called “<strong>CampaignQ</strong>”</div></div></div><div class="compact-table"><div class="compact-row company-row"><div class="compact-cell" style="width:17.656722547884858%"><strong>Company Name:</strong></div><div class="compact-cell" style="width:82.343
